services:
  - type: worker
    # Preserve the existing service identity when upgrading the old worker.
    name: litellm-release-discord-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 bot.py
    # Keeps contributor IDs, PR history, and pending announcements on redeploy.
    disk:
      name: bot-state
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: OSS_CONTRIBUTIONS_CHANNEL_ID
        sync: false
      - key: ANNOUNCEMENTS_CHANNEL_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: POLL_INTERVAL_MINUTES
        value: "5"
      # Keep the first deployment quiet until the moderators-only test is done.
      - key: ANNOUNCEMENTS_ENABLED
        value: "false"
