projects:
  - name: aria-litellm-discord
    environments:
      - name: production
        services:
          - type: pserv
            name: lens-clickhouse
            runtime: docker
            repo: https://github.com/BerriAI/lens
            dockerfilePath: ./deploy/render/clickhouse.Dockerfile
            dockerContext: .
            plan: standard
            disk:
              name: clickhouse-data
              mountPath: /var/lib/clickhouse
              sizeGB: 10
            envVars:
              - key: CLICKHOUSE_USER
                value: lens
              - key: CLICKHOUSE_DB
                value: lens
              - key: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
                value: "1"
              - key: CLICKHOUSE_PASSWORD
                generateValue: true
          - type: web
            name: lens
            runtime: image
            image:
              url: ghcr.io/berriai/lens:0.6.0
            plan: standard
            healthCheckPath: /health/ready
            envVars:
              - key: PORT
                value: "4318"
              - key: LENS_MODE
                value: standalone
              - key: LENS_PUBLIC_URL
                sync: false
              - key: LENS_SIGN_IN_LINK
                value: "false"
              - key: LENS_ADMIN_TOKEN
                generateValue: true
              - key: CLICKHOUSE_HOST
                fromService:
                  type: pserv
                  name: lens-clickhouse
                  property: host
              - key: CLICKHOUSE_USER
                value: lens
              - key: CLICKHOUSE_DATABASE
                value: lens
              - key: CLICKHOUSE_PASSWORD
                fromService:
                  type: pserv
                  name: lens-clickhouse
                  envVarKey: CLICKHOUSE_PASSWORD
              - key: AGENT_TRACING_RETENTION_DAYS
                value: "14"
