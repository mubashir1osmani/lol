previews:
  generation: 'off'

services:
  - type: worker
    # Matches the existing worker. Never create a second bot during a sync.
    name: litellm-discord
    runtime: python
    branch: main
    autoDeployTrigger: 'off'
    # No package installs or build scripts from PyPI: this bot is stdlib-only.
    buildCommand: python3 -I -m compileall -q bot.py contributor_bot
    startCommand: python3 bot.py
    # Keeps contributor IDs, PR history, and pending announcements on redeploy.
    disk:
      name: bot-state
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: OSS_CONTRIBUTIONS_CHANNEL_ID
        sync: false
      - key: ANNOUNCEMENTS_CHANNEL_ID
        sync: false
      # No GitHub or Render credentials: public PRs can be read anonymously.
      - key: POLL_INTERVAL_MINUTES
        value: "5"
      # Keep the first deployment quiet until the moderators-only test is done.
      - key: ANNOUNCEMENTS_ENABLED
        value: "false"
      - key: ROUNDUP_TIMEZONE
        value: America/Toronto
      - key: ROUNDUP_TIME
        value: "09:00"
