previews:
  generation: 'off'

services:
  - type: web
    # One process. Do not add a second bot during a sync.
    name: litellm-discord
    runtime: python
    branch: main
    autoDeployTrigger: 'off'
    healthCheckPath: /health
    # discord.py (gateway presence) and litellm (review agent, off until enabled).
    buildCommand: pip install -r requirements.txt
    startCommand: python3 bot.py
    # Keeps contributor IDs, PR history, and pending announcements on redeploy.
    disk:
      name: bot-state
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: OSS_CONTRIBUTIONS_CHANNEL_ID
        sync: false
      - key: ANNOUNCEMENTS_CHANNEL_ID
        sync: false
      # No GitHub or Render credentials: public PRs can be read anonymously.
      - key: POLL_INTERVAL_MINUTES
        value: "5"
      # Weekly Friday 10:00 AM America/Toronto summary posts to ANNOUNCEMENTS_CHANNEL_ID.
      - key: MERGED_WEEKLY_ENABLED
        value: "true"
      - key: MERGED_POST_WEEKDAY
        value: friday
      - key: MERGED_POST_TIME
        value: "10:00"
      - key: MERGED_POST_TIMEZONE
        value: America/Toronto
