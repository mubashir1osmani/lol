name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - name: Check out code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Enforce dependency-free build
        run: |
          python3 -I -c 'from pathlib import Path; lines = Path("requirements.txt").read_text().splitlines(); assert not any(line.strip() and not line.lstrip().startswith("#") for line in lines), "Runtime dependencies require a security review and an explicit policy change"'
      - name: Run offline tests
        run: python3 -E -s -m unittest discover -v
      - name: Check patch whitespace
        run: git diff --check
